# Public admin/seller access for the WiFi Voucher Portal
# https://voucher-admin.ditronics.co.tz
#
# Serves the SAME app/docroot as the internal voucher-portal.conf (port 8090),
# but deliberately blocks the customer-facing voucher-redemption pages
# (index.php, status.php) — those are captive-portal flows meant for LAN
# clients only and have no brute-force protection on voucher codes.
# Only the universal login (admin+seller) and /admin, /seller app routes
# are reachable here.

server {
    listen 80;
    server_name voucher-admin.ditronics.co.tz;

    root /var/www/voucher-portal/public;
    index login.php;

    access_log /var/log/nginx/voucher-admin-access.log;
    error_log /var/log/nginx/voucher-admin-error.log;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    fastcgi_hide_header X-Powered-By;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Customer voucher-redemption flow stays LAN-only (see comment above)
    location = / {
        return 301 /login.php;
    }
    location = /index.php {
        return 404;
    }
    location = /status.php {
        return 404;
    }

    location / {
        try_files $uri $uri/ /login.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm-voucher.sock;
        fastcgi_index login.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_param SERVER_SOFTWARE "";

        fastcgi_read_timeout 10s;
        fastcgi_send_timeout 10s;
    }

    location ~* (config\.php|config\.example\.php|\.htaccess|\.git|router\.php|deploy\.sh|README\.md|wifi_voucher.*\.md) {
        deny all;
        return 404;
    }

    location ~ ^/(src|migrations)/ {
        deny all;
        return 404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
