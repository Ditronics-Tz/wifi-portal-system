; PHP-FPM pool configuration for WiFi Voucher Portal
; Copy to /etc/php/8.1/fpm/pool.d/voucher-portal.conf

[voucher-portal]
user = www-data
group = www-data

listen = /var/run/php/php8.1-fpm-voucher.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 15s
request_slowlog_timeout = 5s

; Logging
php_admin_value[error_log] = /var/log/php/voucher-portal-error.log
php_admin_flag[log_errors] = on

; Security
php_admin_value[open_basedir] = /var/www/voucher-portal:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off

; Session
php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/php/sessions/voucher-portal
php_value[session.gc_maxlifetime] = 3600

; Performance
php_value[memory_limit] = 64M
php_value[max_execution_time] = 15
php_value[max_input_time] = 15
