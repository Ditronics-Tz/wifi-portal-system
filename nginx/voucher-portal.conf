# Nginx configuration for WiFi Voucher Portal
# Copy this to /etc/nginx/sites-available/ and symlink to sites-enabled

server {
    listen 8090;
    server_name 192.168.100.100;
    
    # Document root
    root /var/www/voucher-portal/public;
    index index.php index.html;
    
    # Logging
    access_log /var/log/nginx/voucher-portal-access.log;
    error_log /var/log/nginx/voucher-portal-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP handling
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;  # Adjust PHP version if needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Security: hide PHP version
        fastcgi_param SERVER_SOFTWARE "";
        
        # Timeouts for RADIUS calls
        fastcgi_read_timeout 10s;
        fastcgi_send_timeout 10s;
    }
    
    # Deny access to sensitive files
    location ~* (config\.php|\.htaccess|\.git) {
        deny all;
        return 404;
    }
    
    # Deny access to src and migrations directories
    location ~ ^/(src|migrations)/ {
        deny all;
        return 404;
    }
    
    # Static files caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

