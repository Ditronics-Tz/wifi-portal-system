# Nginx configuration for WiFi Voucher Portal
# Copy this to /etc/nginx/sites-available/ and symlink to sites-enabled

server {
    listen 8090;
    server_name 192.168.100.100;
    
    # Document root
    root /var/www/voucher-portal/public;
    index index.php index.html;
    
    # Logging
    access_log /var/log/nginx/voucher-portal-access.log;
    error_log /var/log/nginx/voucher-portal-error.log;
    
    # Security headers
    # NOTE: Nginx serves .php files directly via fastcgi below, so router.php
    # (which sets these same headers) is never loaded in this deployment path.
    # These headers must be defined here to actually take effect in production.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    fastcgi_hide_header X-Powered-By;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm-voucher.sock;  # Dedicated voucher-portal pool
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Security: hide PHP version
        fastcgi_param SERVER_SOFTWARE "";

        # Timeouts for RADIUS calls
        fastcgi_read_timeout 10s;
        fastcgi_send_timeout 10s;
    }

    # Deny access to sensitive files
    location ~* (config\.php|config\.example\.php|\.htaccess|\.git|router\.php|deploy\.sh|README\.md|wifi_voucher.*\.md) {
        deny all;
        return 404;
    }

    # Deny access to src, migrations, and legacy admin directories
    location ~ ^/(src|migrations)/ {
        deny all;
        return 404;
    }
    
    # Static files caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

